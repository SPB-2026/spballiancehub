  <!-- Restore the saved Day/Night theme before first paint (no flash).
       Reads the ACTIVE panel's stored preference: /admin → admin key,
       everything else → member key; falls back to the last applied theme,
       then the OS preference. The login page always renders night
       regardless (its tokens are re-pinned in theme.css). -->
  <script>
    (function () {
      try {
        var k = location.pathname.indexOf('/admin') === 0 ? 'spb-admin-theme' : 'spb-member-theme';
        var t = localStorage.getItem(k) || localStorage.getItem('spb-theme') ||
          (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'day' : 'night');
        if (t === 'day' || t === 'night') document.documentElement.dataset.theme = t;
      } catch (e) { /* no-op */ }
    })();
  </script>
